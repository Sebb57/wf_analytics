name: Daily analysis

on:
  schedule:
    # cron runs in UTC: 23:00 UTC is midnight in Paris (1am in summer time)
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analysis

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev zlib1g-dev nlohmann-json3-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      # written aside first: a failed run leaves analytics.json untouched
      - name: Scrape
        run: |
          ./warframe_analytics > analytics.new
          mv analytics.new analytics.json

      - name: Commit
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git add analytics.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: daily items analysis"
          git pull --rebase
          git push
